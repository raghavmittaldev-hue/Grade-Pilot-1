services:
  - type: web
    name: markbook
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_PATH
        value: /var/data/markbook.db
    disk:
      name: markbook-data
      mountPath: /var/data
      sizeGB: 1
